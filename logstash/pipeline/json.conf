# Pipeline 2 : fichiers JSON (une ligne JSON par log) déposés dans /data/uploads
input {
  file {
    path => "/data/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
    mode => "read"
    codec => "json"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/json_completed.log"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    convert => { "status_code" => "integer" "response_time" => "float" }
    uppercase => ["level"]
  }
  grok { match => { "[log][file][path]" => "/data/uploads/%{GREEDYDATA:file_name}" } }
  mutate { remove_field => ["timestamp","host","event","log"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    index => "logs-saas-%{+YYYY.MM.dd}"
    data_stream => false                 # index classique, pas de data stream
  }
}