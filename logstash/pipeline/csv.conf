# Pipeline 1 : fichiers CSV déposés dans /data/uploads
input {
  file {
    path => "/data/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
    mode => "read"                                  # lit le fichier en entier
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/csv_completed.log"
  }
}

filter {
  # Supprimer le retour chariot Windows (\r) en fin de ligne
  mutate { gsub => [ "message", "\r", "" ] }

  # Ignorer la ligne d'en-tête
  if [message] =~ /timestamp,level,service/ { drop { } }

  csv {
    separator => ","
    columns => ["timestamp","level","service","source","http_method","endpoint",
                "status_code","response_time","user_id","tenant","feature",
                "client_ip","sql_query","message_text"]
    skip_empty_columns => true
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    convert => { "status_code" => "integer" "response_time" => "float" }
    rename  => { "message_text" => "msg" }
  }
  mutate {
    replace => { "message" => "%{msg}" }
    uppercase => ["level"]
  }

  # Nom du fichier d'origine (utile pour relier les logs au fichier importé)
  grok { match => { "[log][file][path]" => "/data/uploads/%{GREEDYDATA:file_name}" } }

  mutate { remove_field => ["timestamp","msg","host","event","log"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST}"]
    index => "logs-saas-%{+YYYY.MM.dd}"
    data_stream => false                 # index classique, pas de data stream
  }
}